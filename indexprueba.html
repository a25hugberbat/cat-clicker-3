<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cat Clicker Vue</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="app" class="container py-4">
    <h1 class="text-center mb-4">Cat Clicker Premium</h1>

    <div class="d-flex justify-content-center align-items-start gap-3 flex-wrap">
      <!-- Lista -->
      <div class="card" style="width: 12rem;">
        <div class="card-header fw-bold">Gatos</div>
        <ul class="list-group list-group-flush">
          <li v-for="(gato, index) in gatos"
              :key="index"
              class="list-group-item list-group-item-action"
              :class="{ active: index === catActive }"
              @click="catActive = index"
              style="cursor: pointer;">
            {{ gato.name }}
          </li>
        </ul>
      </div>

      <!-- Gato activo -->
      <div class="card text-center p-3" style="width: 20rem;">
        <img :src="gatoActivo.image" :alt="gatoActivo.name"
             class="card-img-top" style="cursor: pointer;"
             @click="gatoActivo.nclicks++">
        <h2>{{ gatoActivo.name }}</h2>
        <p>Clicks: {{ gatoActivo.nclicks }}</p>
      </div>
    </div>
  </div>

  <script>
    Vue.createApp({
      data() {
        return {
          catActive: 0,
          gatos: [
            { name: "Manuel",          image: "cat1.jpg", nclicks: 0 },
            { name: "Gato Marciano",   image: "cat2.jpg", nclicks: 0 },
            { name: "Gatendrik Lamer", image: "cat3.jpg", nclicks: 0 },
            { name: "Gato Soviético",  image: "cat4.jpg", nclicks: 0 },
            { name: "Gato Fresa",      image: "cat5.jpg", nclicks: 0 }
          ]
        };
      },
      computed: {
        gatoActivo() {
          return this.gatos[this.catActive];
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
